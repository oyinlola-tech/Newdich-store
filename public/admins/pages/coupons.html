<!DOCTYPE html>
<html lang="en">
<head>
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com data:; img-src 'self' data: https://via.placeholder.com; connect-src 'self' http://localhost:3000; base-uri 'self'; form-action 'self'; frame-ancestors 'none'">
    <meta name="referrer" content="no-referrer">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Coupons | Telente Store</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="/admins/css/admin.css">
</head>
<body>
    <div class="admin-wrapper">
        <aside class="admin-sidebar">
            <div class="sidebar-header">
                <h2>Telente Admin</h2>
            </div>
            <nav class="sidebar-nav">
                <ul>
                    <li><a href="/admin"><i class="fas fa-dashboard"></i> Dashboard</a></li>
                    <li><a href="/admin/products"><i class="fas fa-box"></i> Products</a></li>
                    <li><a href="/admin/categories"><i class="fas fa-tags"></i> Categories</a></li>
                    <li><a href="/admin/inventory"><i class="fas fa-warehouse"></i> Inventory</a></li>
                    <li><a href="/admin/orders"><i class="fas fa-shopping-cart"></i> Orders</a></li>
                    <li><a href="/admin/returns"><i class="fas fa-undo"></i> Returns</a></li>
                    <li><a href="/admin/contact"><i class="fas fa-envelope"></i> Contact</a></li>
                    <li><a href="/admin/coupons" class="active"><i class="fas fa-ticket-alt"></i> Coupons</a></li>
                    <li><a href="/admin/payment-settings"><i class="fas fa-credit-card"></i> Payments</a></li>
                    <li><a href="/admin/users"><i class="fas fa-users"></i> Users</a></li>
                </ul>
            </nav>
            <div class="sidebar-footer">
                <button id="logout-btn"><i class="fas fa-sign-out-alt"></i> Logout</button>
            </div>
        </aside>

        <main class="admin-main">
            <header class="admin-header">
                <div class="header-title">
                    <h1>Coupon Management</h1>
                </div>
                <div class="header-user">
                    <span id="admin-name">Admin</span>
                </div>
            </header>

            <div class="admin-content">
                <div class="filters">
                    <div class="filter-group">
                        <label for="coupon-search">Search</label>
                        <input type="text" id="coupon-search" placeholder="Coupon code">
                    </div>
                    <div class="filter-actions">
                        <button id="create-coupon-btn" class="btn-primary"><i class="fas fa-plus"></i> Create Coupon</button>
                    </div>
                </div>

                <div id="coupons-container">
                    <div class="loading">Loading coupons...</div>
                </div>
            </div>
        </main>
    </div>

    <div id="coupon-modal" class="modal" style="display: none;">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Create Coupon</h2>
            <form id="coupon-form">
                <div class="form-group">
                    <label for="coupon-code">Code</label>
                    <input type="text" id="coupon-code" required>
                </div>
                <div class="form-group">
                    <label for="coupon-type">Type</label>
                    <select id="coupon-type">
                        <option value="PERCENTAGE">Percentage</option>
                        <option value="FIXED">Fixed Amount</option>
                        <option value="CREDIT">Store Credit (Balance)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="coupon-value">Value</label>
                    <input type="number" id="coupon-value" step="0.01" min="0" required>
                </div>
                <div class="form-group">
                    <label for="coupon-balance">Initial Balance (for credit coupons)</label>
                    <input type="number" id="coupon-balance" step="0.01" min="0">
                </div>
                <div class="form-group">
                    <label for="coupon-limit">Usage Limit</label>
                    <input type="number" id="coupon-limit" min="1">
                </div>
                <div class="form-group">
                    <label for="coupon-valid-until">Valid Until</label>
                    <input type="datetime-local" id="coupon-valid-until">
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn-primary">Create</button>
                    <button type="button" id="cancel-modal" class="btn-secondary">Cancel</button>
                </div>
            </form>
            <div id="coupon-message" class="profile-message" style="display: none;"></div>
        </div>
    </div>

    <script type="module" src="/admins/js/main/coupons.js"></script>
    <script type="module" src="/admins/js/main/admin.js"></script>
</body>
</html>
