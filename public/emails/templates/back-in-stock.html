<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telente Store</title>
    <link rel="stylesheet" href="/emails/css/email.css">
</head>
<body>
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background-color: #f4f6f9;">
        <tr>
            <td align="center" style="padding: 40px 0;">
                <table role="presentation" class="email-wrapper" cellspacing="0" cellpadding="0" border="0">
                    <tr>
                        <td class="email-header">
                            <a href="/" class="email-wordmark">
                                TELENTE
                                <span>STORE</span>
                            </a>
                        </td>
                    </tr>
                    <tr>
                        <td class="email-body">
                            <h1 class="email-headline">back-in-stock</h1>
                            <p class="email-subhead">This is a placeholder for the back-in-stock email.</p>
                            <a href="/" class="email-button">Take action →</a>
                        </td>
                    </tr>
                    <tr>
                        <td class="email-footer">
                            <a href="/" class="email-footer-wordmark">TELENTE STORE</a>
                            <div class="email-footer-links">
                                <a href="/">Shop</a>
                                <a href="/contact">Help</a>
                                <a href="/contact">Contact</a>
                            </div>
                            <p class="email-footer-legal">© 2026 Telente Store · <a href="/">Privacy</a> · <a href="/">Terms</a> · <a href="/">Unsubscribe</a></p>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
