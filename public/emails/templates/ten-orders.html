<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>10 Orders | Telente Store</title>
    <link rel="stylesheet" href="/emails/css/email.css">
</head>
<body class="auth-guest">
    <script>sessionStorage.getItem("authToken")&&(document.body.classList.add("auth-authenticated"),document.body.classList.remove("auth-guest"));</script>
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background-color: #f4f6f9;">
        <tr>
            <td align="center" style="padding: 40px 0;">
                <table role="presentation" class="email-wrapper" cellspacing="0" cellpadding="0" border="0">
                    <tr>
                        <td class="email-header">
                            <a href="/" class="email-wordmark">
                                TELENTE
                                <span>STORE</span>
                            </a>
                        </td>
                    </tr>
                    <tr>
                        <td class="email-body" style="text-align: center;">
                            <h1 class="email-headline">TEN DOWN.</h1>
                            <p class="email-subhead">Thanks for coming back. You've now placed 10 orders with Telente Store.</p>
                            <a href="/products" class="email-button">Keep shopping →</a>
                        </td>
                    </tr>
                    <tr>
                        <td class="email-footer">
                            <a href="/" class="email-footer-wordmark">TELENTE STORE</a>
                            <div class="email-footer-links">
                                <a href="/products">Shop</a>
                                <a href="/contact">Help</a>
                                <a href="/contact">Contact</a>
                            </div>
                            <p class="email-footer-legal">© 2026 Telente Store · <a href="/privacy">Privacy</a> · <a href="/terms">Terms</a> · <a href="/unsubscribe">Unsubscribe</a></p>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
