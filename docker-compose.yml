services:
  db:
    image: mysql:8.4
    container_name: telente-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_password}
      MYSQL_DATABASE: ${DB_NAME:-telente_store}
      MYSQL_USER: ${DB_USER:-telente}
      MYSQL_PASSWORD: ${DB_PASSWORD:-telente_password}
    ports:
      - '${DB_PORT:-3307}:3306'
    volumes:
      - telente_mysql_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: .
    container_name: telente-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      DATABASE_URL: mysql://${DB_USER:-telente}:${DB_PASSWORD:-telente_password}@db:3306/${DB_NAME:-telente_store}
    ports:
      - '${PORT:-3000}:3000'
    volumes:
      - telente_uploads:/app/uploads

volumes:
  telente_mysql_data:
  telente_uploads:
